[vars]
electron_dir = "{{ [config_root, 'node_modules', 'electron'] | join_path }}"
electron_path = "{{ [vars.electron_dir, 'path.txt' ] | join_path }}"
electron_dist = "{{ [vars.electron_dir, 'dist' ] | join_path }}"
electron_cache = "{{ [xdg_cache_home, 'electron'] | join_path }}"
electron_plist = "{{ [vars.electron_dist, 'Electron.app', 'Contents', 'Info.plist' ] | join_path }}"
awrit_native_dir = "{{ [config_root, 'awrit-native-rs',] | join_path }}"
dist_dir = "{{ [config_root, 'dist'] | join_path }}"
release_platform = """{% set targets = {
  'x86_64-unknown-linux-gnu': 'linux-x64',
  'aarch64-unknown-linux-gnu': 'linux-arm64',
  'x86_64-apple-darwin': 'macos-x64',
  'aarch64-apple-darwin': 'macos-arm64',
} %}{{ targets | get(key=env.BUILD_TARGET | default(value=''), default=os() ~ '-' ~ arch()) }}"""

[env]

[tools]
bun = "1.4.0"
rust = "stable"
cargo-binstall = "latest"
pre-commit = "latest"
cocogitto = "latest"
"aqua:ouch-org/ouch" = "latest"
node = "22.12.0"

[hooks]
postinstall = { task = "postinstall" }

[tasks.postinstall]
quiet = true
hide = true
run = [
  { task = "setup" },
]

[settings]
cargo.binstall = true
cargo.binstall_only = true
task.quiet = true

##########################################################
# Setup environment
[tasks."setup"]
description = "setup a developpment environment"
run = [
  "{% if not env.GITHUB_WORKFLOW %} mise run 'pc:init' {% endif %}",
  "bun install",
  { task = "setup:build" },
  { task = "setup:verify-electron" },
  { task = "setup:patch-electron" },
]

[tasks."setup:verify-electron"]
description = "If bun's extract-zip failed fall back to `ouch`"
hide = true
run = '''
{% if vars.electron_path is not file %}
  {% set cache = exec(command="find " ~ vars.electron_cache ~ " -name electron-*.zip -print -quit") %}
  {% if cache %}
    mise run setup:unzip-electron {{ cache }}
  {% else %}
    echo "failed to install electron"
    exit 1
  {% endif %}
{% endif %}
'''

[tasks."setup:unzip-electron"]
hide = true
usage = '''
arg "<file>"
'''
run = '''
ouch decompress {{ usage.file }} -d {{ vars.electron_dist }} -r -q -y
printf 'electron' >{{ vars.electron_path }}
'''

[tasks."setup:patch-electron"]
description = "on macos patch Electron.app to not display in the Dock"
hide = true
run = '''
{% if os() == "macos" %}
  sed -i '' 's/<\/dict>/    <key>LSUIElement<\/key>\n    <true\/>\n<\/dict>/' {{ vars.electron_plist }} || true
{% endif %}
'''

[tasks."setup:build"]
description = "build awrit-native-rs package"
dir = "{{ vars.awrit_native_dir }}"
env.BUILD_TARGET = { default = "" }
run = '''
{% if env.GITHUB_WORKFLOW %}
  bun napi build --platform --release --target {{ env.BUILD_TARGET }}
  {% if env.BUILD_TARGET == "x86_64-apple-darwin" %}
    rm awrit-native-rs.darwin-arm64.node
  {% endif %}
{% else %}
  bun napi build --platform --release
{% endif %}
  bun scripts/fix-types.js
'''

[tasks."setup:clean"]
alias = "clean"
description = "clean-up source tree from installed and generated artifacts"
confirm = "this action is irreversible, continue?"
run = [
  # root
  "rm -rf ./node_modules 2>/dev/null || :",
  # dist is the single shippable tree; the release tarball + checksum land at the project root
  "rm -rf ./dist 2>/dev/null || :",
  "rm -f ./awrit-*.tar.gz ./awrit-*.tar.gz.sha 2>/dev/null || :",
  "rm -rf ./.bun 2>/dev/null || :",
  # awrit-native-rs
  "rm -rf ./awrit-native-rs/node_modules 2>/dev/null || :",
  "rm -rf ./awrit-native-rs/target 2>/dev/null || :",
  "rm -f ./awrit-native-rs/package-lock.json 2>/dev/null || :",
  "rm -f ./awrit-native-rs/index.js 2>/dev/null || :",
  "rm -f ./awrit-native-rs/index.d.ts 2>/dev/null || :",
  "rm -f ./awrit-native-rs/awrit-native-rs.linux-x64-gnu.node 2>/dev/null || :",
  # crates
  "rm -rf ./awrit-native-rs/crates/crossterm/target 2>/dev/null || :",
  "rm -rf ./awrit-native-rs/crates/crossterm/Cargo.lock 2>/dev/null || :",
  "rm -rf ./awrit-native-rs/crates/bgra-to-rgba/target 2>/dev/null || :",
  # runner
  "rm -rf ./src/runner/node_modules 2>/dev/null || :",
]

[tasks."setup:zero"]
alias = "zero"
description = "uninstall all tools and clean build artiacts"
run = '''
{% set installed = exec(command="mise ls -l --no-header | awk '{print $1}'") | split(pat='\n')  %}
{% if installed %}
mise uninstall --dry-run {{ installed | join(sep=' ') }}
{% endif %}
mise clean
'''

##########################################################
# Dev commands
[tasks."dev:format"]
alias = "format"
description = "check code formatting"
usage = '''
arg "[files]" help="files to format" var=#true default="."
flag "--write" help="format the file(s)" default=#false
'''
run = '''
{% if usage.write %}
  biome format --write {{ usage.files | join(sep=' ') }}
{% else %}
  biome check --linter-enabled=false --assist-enabled=false {{ usage.files | join(sep=' ') }}
{% endif %}
'''

[tasks."dev:lint"]
alias = "lint"
description = "lint code"
usage = '''
arg "[files]" help="files to lint" var=#true default="./src"
flag "--write" help="apply safe fixes" default=#false
flag "--unsafe" help="also apply unsafe fixes" default=#false
'''
run = '''
{% if usage.write %}
  {% if usage.unsafe %}
    biome lint --write --unsafe {{ usage.files | join(sep=' ') }}
  {% else %}
    biome lint --write {{ usage.files | join(sep=' ') }}
  {% endif %}
{% else %}
  biome lint {{ usage.files | join(sep=' ') }}
{% endif %}
'''

[tasks."dev:typecheck"]
alias = "typecheck"
description = "verify typescript types"
run = "tsc --noEmit --skipLibCheck"

[tasks."dev:audit"]
alias = "audit"
description = "audit node installed packages for vulnerabilities"
usage = '''
arg "<level>" help="audit level" {
  choices "low" "moderate" "high" "critical"
  default "high"
}
flag "--show-fix" help="show available fixes" default=#false
'''
run = '''
{% if usage.show_fix %}
  bun audit fix --audit-level={{ usage.level }} --prod --dry-run
{% else %}
  bun audit --audit-level={{ usage.level }} --prod
{% endif %}
'''

##########################################################
# Tests
[tasks."test:all"]
alias = "test"
description = "run the tests suite"
run = "bun test"

[tasks."test:input"]
description = "run interactive input test"
run = "bun run ./src/tty/inputTest.ts"

[tasks."test:gfx"]
description = "run graphics test"
run = "bun run ./src/tty/graphicsTest.ts"


##########################################################
# Pre-commit
[tasks."pc:init"]
description = "initialize pre-commit"
silent = "stdout"
run = "pre-commit install --install-hooks"

[tasks."pc:update"]
description = "update pre-commit hooks"
depends = ["pc:init"]
run = "pre-commit autoupdate"

[tasks."pc:check"]
description = "run pre-commit hooks"
depends = ["pc:init"]
run = "pre-commit run --all-files"

[tasks."pc:clean"]
description = "cleanup pre-commit hooks"
depends = ["pc:init"]
run = ["pre-commit clean", "pre-commit gc"]

##########################################################
# Version
[tasks."version:suggest"]
description = "suggest next version tag"
run = "cog bump --dry-run --auto --skip-untracked --disable-bump-commit"

[tasks."version:get"]
description = "output actual version tag"
run = "cog -v get-version --include-prereleases --tag"

[tasks."version:bump-pkg"]
description = "bump version in package.json"
hide = true
usage = '''
arg "<version>"
'''
run = "bun pm version {{ usage.version }} --no-git-tag-version --force"

##########################################################
# CI
[tasks."ci:version-bump"]
description = "make CHANELOG.md, bump version and commit if in CI"
env = { "GITHUB_WORKFLOW" = { required = "task only allowed in CI workflow" } }
hide = true
run = "cog bump --auto"

[tasks."ci:cover-badge"]
description = "generate a coverage.svg badge"
env = { "GITHUB_WORKFLOW" = { required = "task only allowed in CI workflow" } }
hide = true
tools."pipx:genbadge[coverage]" = "latest"
tools."pipx:lcov_cobertura" = "latest"
run = "lcov_cobertura lcov.info && genbadge coverage -i coverage.xml -o assets/coverage.svg"

##########################################################
# Runner
[tasks.awrit]
usage = '''
arg "[args]" var=#true help="any arguments to provide to awrit"
'''
run = "bun run {{ config_root }}/src/runner {{ usage.args | join(sep=' ') }}"

##########################################################
# Release
#
# dist/ is the single shippable tree: the dev flow (mise run awrit) and the
# release pipeline write into the same layout, and pack_release compresses it
# as-is. The tarball + checksum land at the project root. Subtasks are named
# after what they ship:
#   bundle_electron -> dist/electron/app  (JS bundle + version + theme)
#   bundle_awrit    -> dist/awrit         (compiled runner)
#   ship_meta       -> dist/LICENSE, README.md, CHANGELOG.md
#   stage_runtime   -> dist/electron/{awrit-native-rs,path.txt,dist}
#   macos_patch     -> dock-hide the bundled Electron (macOS only)
#   pack_release    -> dist/ -> <root>/awrit-<ver>-<platform>.tar.gz + .sha
#   verify_bundle   -> unpack to scratch, assert the layout, run the binary once
[tasks."release"]
description = "build a self-contained release tarball and checksum for this platform"
env.release_version = "{{ exec(command='mise run version:get') | trim | trim_start(pat='v') }}"
env.release_name = "awrit-{{ env.release_version }}-{{ vars.release_platform }}"
env.release_tarball = "{{ env.release_name ~ '.tar.gz' }}"
env.release_checksum = "{{ env.release_name ~ '.tar.gz.sha' }}"
run = [
  { task = "bundle_electron" },
  { task = "bundle_awrit" },
  { task = "ship_meta" },
  { task = "stage_runtime" },
  { task = "macos_patch" },
  { task = "pack_release" },
  { task = "verify_bundle" },
]

[tasks.bundle_electron]
description = "Electron main bundle + version marker + theme placeholder into dist/electron/app"
hide = true
run = [
  "rm -rf dist",
  "mkdir -p dist/electron/app",
  "bun build src/index.ts --outdir dist/electron/app --root src --target node --format cjs --sourcemap=inline --external electron --external '*.node' --external '*/awrit-native-rs'",
  "mkdir -p dist/electron/app/electron-chrome-extensions/dist",
  "cp node_modules/electron-chrome-extensions/dist/chrome-extension-api.preload.js dist/electron/app/electron-chrome-extensions/dist/",
  "printf '%s' {{ env.release_version }} >dist/electron/app/version",
  # No TTY at pack time: ship an empty theme placeholder
  "touch dist/electron/app/kitty.css",
]

[tasks.bundle_awrit]
description = "compile the runner into dist/awrit"
hide = true
run = '''
bun build --compile src/runner/index.ts --outfile dist/awrit \
  --external electron --external '*.node'
'''

[tasks.ship_meta]
description = "ship LICENSE, README and CHANGELOG into dist/"
hide = true
run = '''
mkdir -p dist
cp LICENSE README.md CHANGELOG.md dist/
'''

[tasks.stage_runtime]
description = "stage the native addon + electron runtime next to the app in dist/electron/"
hide = true
run = '''
mkdir -p dist/electron/awrit-native-rs
cp {{ vars.awrit_native_dir }}/index.js {{ vars.awrit_native_dir }}/index.d.ts dist/electron/awrit-native-rs/
cp {{ vars.awrit_native_dir }}/*.node dist/electron/awrit-native-rs/
cp node_modules/electron/path.txt dist/electron/path.txt
cp -R node_modules/electron/dist dist/electron/dist
'''

[tasks.macos_patch]
description = "macOS: hide the bundled Electron from the Dock before packing"
hide = true
run = '''
{% if os() == "macos" %}
  sed -i '' 's/<\/dict>/    <key>LSUIElement<\/key>\n    <true\/>\n<\/dict>/' "dist/electron/dist/Electron.app/Contents/Info.plist" || true
{% endif %}
'''

[tasks.pack_release]
description = "pack dist/ into <root>/awrit-<ver>-<platform>.tar.gz and write the .sha checksum"
hide = true
dir = "{{ vars.dist_dir }}"
run = '''
ouch compress -q -y awrit electron LICENSE README.md CHANGELOG.md "{{ config_root }}/{{ env.release_tarball }}"
cd "{{ config_root }}"
if command -v sha256sum >/dev/null 2>&1; then
  sha256sum "{{ env.release_tarball }}" >"{{ env.release_checksum }}"
else
  shasum -a 256 "{{ env.release_tarball }}" >"{{ env.release_checksum }}"
fi
'''

[tasks.verify_bundle]
description = "unpack the tarball to a scratch dir, assert the layout and run the binary once"
hide = true
run = '''
  scratch="$(mktemp -d)"
  trap 'rm -rf "$scratch"' EXIT
  ouch decompress -q -y "{{ config_root }}/{{ env.release_tarball }}" -d "$scratch"
  {% for f in ["awrit", "electron/app/index.js", "electron/app/kitty.css", "electron/app/version", "electron/app/electron-chrome-extensions/dist/chrome-extension-api.preload.js", "electron/awrit-native-rs/index.js", "LICENSE", "README.md", "CHANGELOG.md", "electron/path.txt"] %}
  test -e "$scratch/{{ f }}" || { echo "release: missing {{ f }}" >&2; exit 1; }
  {% endfor %}
  test -f "{{ config_root }}/{{ env.release_checksum }}" || { echo "release: missing {{ env.release_checksum }}" >&2; exit 1; }
  "$scratch/awrit" --help >/dev/null
  test "$("$scratch/awrit" --version)" = "{{ env.release_version }}" || { echo "release: version mismatch" >&2; exit 1; }
  echo "release: ok -> {{ config_root }}/{{ env.release_tarball }}"
  '''
